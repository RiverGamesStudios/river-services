<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>River Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        .blur-sm { filter: blur(4px); }
        .no-blur { filter: blur(0); }
        .spinner { border: 4px solid rgba(0,0,0,0.1); border-left-color: #3b82f6; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 text-center">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">River Services</h1>
        
        <div id="loading-indicator" class="text-gray-600 text-lg mb-4">
            <div class="spinner"></div>
            Loading services...
        </div>

        <div id="service-management-container" class="hidden">
            <!-- Rebound Tanks Section -->
            <h3 class="text-2xl font-bold mb-6 text-gray-800">Rebound Tanks</h3>
            <p id="rebound-link-display" class="text-gray-700 text-base font-semibold mb-4 hidden">
                Your Link Code: <span class="font-mono text-indigo-600 blur-sm" id="rebound-code-span"></span><br>
                <button id="toggle-rebound-code" class="mt-2 px-3 py-1 bg-gray-200 rounded text-xs">Show Code</button>
                <button id="copy-rebound-code" class="mt-2 ml-2 px-3 py-1 bg-green-500 text-white rounded text-xs">Copy</button>
            </p>
            <button id="enable-rebound-btn" class="w-full bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">Enable Service</button>
        </div>

        <div id="message-area-services" class="mt-4 p-3 rounded-lg text-sm text-left hidden"></div>
        <a href="account.html"><button class="w-full bg-gray-500 text-white py-2 px-4 rounded mt-4">Back to Account</button></a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const SUPABASE_URL = 'https://lmewabaqrhkxvpydrjjh.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // Use your actual key here
            const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            const enableReboundBtn = document.getElementById('enable-rebound-btn');
            const reboundDisplay = document.getElementById('rebound-link-display');
            const reboundCodeSpan = document.getElementById('rebound-code-span');
            
            async function loadStatus() {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) return window.location.href = 'magic.html';

                const { data: service } = await supabase.from('rbt_data').select('*').eq('user_id', user.id).single();
                
                if (service) {
                    reboundCodeSpan.textContent = service.LinkCode;
                    reboundDisplay.classList.remove('hidden');
                    enableReboundBtn.textContent = 'Disable Service';
                    enableReboundBtn.classList.replace('bg-blue-500', 'bg-red-500');
                }
                document.getElementById('loading-indicator').classList.add('hidden');
                document.getElementById('service-management-container').classList.remove('hidden');
            }

            document.getElementById('toggle-rebound-code').onclick = () => {
                reboundCodeSpan.classList.toggle('blur-sm');
                reboundCodeSpan.classList.toggle('no-blur');
            };

            loadStatus();
        });
    </script>
</body>
</html>
